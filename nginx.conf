# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rentacar.thradex.com;

    ssl_certificate /etc/letsencrypt/live/rentacar.thradex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentacar.thradex.com/privkey.pem;

    # Limit the request rate to 50 requests per second per IP address
    limit_req zone=mylimit burst=100 nodelay;

    # Frontend (Root)
    location / {
        proxy_pass http://bc-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Panel
    location /admin/ {
        proxy_pass http://bc-admin:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://bc-backend:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared CDN directory
    location /cdn/ {
        alias /var/www/cdn/;
        autoindex off;
    }
}
