client_max_body_size 100M;
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rentacar.thradex.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name turagua.thradex.com;
    limit_req zone=mylimit burst=100 nodelay;
    # Frontend de Turagua (Puerto 3002)
    location / {
        proxy_pass http://turagua-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Backend de Turagua (Puerto 4002)
    location /api/ {
        proxy_pass http://turagua-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared CDN directory
    location /cdn/ {
        alias /var/www/cdn/;
        autoindex off;
    }
}


