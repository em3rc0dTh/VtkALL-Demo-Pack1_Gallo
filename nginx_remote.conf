client_max_body_size 100M;
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;

# ==========================================
# HTTP REDIRECTS (Puerto 80)
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name rentacar.thradex.com turagua.thradex.com galloautos.thradex.com bateylate.thradex.com;

    # Permitir a Certbot validar los dominios sin redirigir a HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirigir el resto del tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# RENTACAR (HTTPS)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rentacar.thradex.com;

    ssl_certificate /etc/letsencrypt/live/rentacar.thradex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentacar.thradex.com/privkey.pem;

    limit_req zone=mylimit burst=100 nodelay;

    location / {
        proxy_pass http://bc-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://bc-admin:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://bc-backend:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cdn/ {
        alias /var/www/cdn/;
        autoindex off;
    }
}

# ==========================================
# TURAGUA (HTTPS)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turagua.thradex.com;

    ssl_certificate /etc/letsencrypt/live/turagua.thradex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turagua.thradex.com/privkey.pem;

    limit_req zone=mylimit burst=100 nodelay;

    location / {
        proxy_pass http://turagua-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenWA Dashboard
    location = /wa {
        return 301 /wa/;
    }

    location /wa/ {
        proxy_pass http://turagua-openwa-dashboard:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenWA API
    location /wa/api/ {
        proxy_pass http://turagua-openwa:2785/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenWA WebSocket
    location /socket.io/ {
        proxy_pass http://turagua-openwa:2785/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://turagua-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

